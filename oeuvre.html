<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artemis Galerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,100..900&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="catalogue.css">
</head>
<body class="page">
<header class="top">
  <a class="lg" href="index.html" aria-label="Artemis Galerie, accueil"><img src="logo.png" alt="" aria-hidden="true"></a>
  <button class="bg" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
</header>
<nav class="menu" id="menu" aria-label="Menu">
  <button class="cl" id="cl" data-i="close"></button>
  <ul><li><a href="index.html#collection" data-i="nCol"></a></li><li><a href="index.html#visite" data-i="nVis"></a></li></ul>
  <div class="ft"><div class="lang" role="group" aria-label="Langue"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
  <nav class="social" aria-label="Réseaux sociaux">
    <a href="https://www.instagram.com/artemisgalerietg/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.facebook.com/p/Artemis-Galerie-61569428815346/" target="_blank" rel="noopener">Facebook</a>
    <a href="https://www.tiktok.com/@artemis.galerie" target="_blank" rel="noopener">TikTok</a>
  </nav></div>
</nav>
<main id="fiche"></main>
<footer><span>© 2026 Artemis Galerie</span></footer>
<dialog class="lb" id="lb" aria-label="Image"><button class="lbc" id="lbc" data-i="close"></button><div class="lbs" id="lbs"><div class="lbi" id="lbi"></div></div></dialog>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const {$,$$,W}=A;
const id=+new URLSearchParams(location.search).get('id'),i=W.findIndex(w=>w.id===id),w=W[i];
const lb=$('#lb'),lbi=$('#lbi'),lbs=$('#lbs');
let k=0;

function render(){const x=A.x(),e=A.lang==='en'?1:0,m=$('#fiche');A.apply();
  if(!w){document.title='Artemis Galerie';
    m.innerHTML=`<div class="fx"><div class="gal"><p class="txt">${x.nf}</p><a class="lnk" href="index.html#collection">${x.back}</a></div></div>`;return}
  const ti=A.ti(w),sold=w.s==='v',link=A.abs(w);
  document.title=`${ti}, ${w.a} | Artemis Galerie`;
  const same=W.filter(o=>o.id!==w.id&&o.a===w.a),list=(same.length?same:W.filter(o=>o.id!==w.id)).slice(0,3);
  const P=W[(i+W.length-1)%W.length],N=W[(i+1)%W.length];
  const btn=sold?`<a class="btn" href="index.html#collection">${x.avail}</a>`:`<a class="btn k" href="${A.wa(x.msg(ti,w.a,link))}" target="_blank" rel="noopener">${x.wa}</a>`;
  m.innerHTML=`
  <a class="back" href="index.html#collection">${x.back}</a>
  <div class="fx">
    <div class="gal">
      <button class="main" data-pic style="--vt:w${w.id};--r:${w.r}" aria-label="${x.zoom}">${A.art(w,'m',0,1)}</button>
      <p class="hint">${x.zoom}</p>
      ${w.det.length?`<div class="dets">${w.det.map(s=>`<img data-pic src="${s}" alt="${ti}" loading="lazy">`).join('')}</div>`:''}
    </div>
    <aside class="cartel">
      <div class="ar">${w.a}</div>
      <h1>${ti}</h1>
      <p class="ln">${x.f[w.ty]}, ${w.y}</p>
      <p class="ln">${w.m[e]}</p>
      <p class="ln">${w.d}</p>
      <div class="pr">${A.price(w)}</div>
      <p class="txt">${A.tx(w)}</p>
      <div class="acts">${btn}<button class="lnk" id="sh">${x.share}</button></div>
      <p class="ln" style="margin-top:28px"><a class="lnk" href="index.html#visite">${x.visit}</a></p>
    </aside>
  </div>
  <section class="more"><h2>${same.length?x.same:x.others}</h2><div class="mg">${list.map(o=>`<a class="mini" href="${A.url(o)}"><span class="im">${A.art(o,'o'+o.id)}</span><div class="ar">${o.a}</div><div class="tt"><em>${A.ti(o)}</em></div></a>`).join('')}</div></section>
  <nav class="pn"><a href="${A.url(P)}"><small>${x.prev}</small><em>${A.ti(P)}</em></a><a href="${A.url(N)}" style="text-align:right"><small>${x.next}</small><em>${A.ti(N)}</em></a></nav>
  <div class="bar"><div class="pr">${A.price(w)}</div>${sold?'':btn}</div>`;
  /* Les proportions réelles d'une photo remplacent celles des données */
  const im=$('.main img');
  if(im){const f=()=>$('.main').style.setProperty('--r',im.naturalWidth/im.naturalHeight);im.complete?f():im.onload=f}
}

/* Visionneuse : clic pour agrandir, clic dans la visionneuse pour zoomer, flèches pour changer de vue */
function show(n){const p=[...$$('[data-pic]')];if(!p.length)return;k=(n+p.length)%p.length;
  lbi.innerHTML=p[k].tagName==='IMG'?p[k].outerHTML:p[k].innerHTML;lb.classList.remove('z');if(!lb.open)lb.showModal()}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-pic]');if(p){show([...$$('[data-pic]')].indexOf(p));return}
  if(e.target.id==='sh')share(e.target)});
lbi.onclick=()=>{lb.classList.toggle('z');lbs.scrollLeft=(lbs.scrollWidth-lbs.clientWidth)/2;lbs.scrollTop=(lbs.scrollHeight-lbs.clientHeight)/2};
$('#lbc').onclick=()=>lb.close();
lb.addEventListener('close',()=>lb.classList.remove('z'));
addEventListener('keydown',e=>{if(!lb.open)return;if(e.key==='ArrowRight')show(k+1);if(e.key==='ArrowLeft')show(k-1)});

async function share(b){const x=A.x(),u=location.href;
  try{if(navigator.share){await navigator.share({title:`${A.ti(w)}, ${w.a}`,url:u});return}
    await navigator.clipboard.writeText(u);b.textContent=x.copied;setTimeout(()=>b.textContent=x.share,2200)}catch(_){}}

A.onLang=render;A.init();render();
</script>
</body>
</html>
