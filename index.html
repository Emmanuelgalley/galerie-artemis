<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artemis Galerie</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="hero">
  <div id="hart"></div>
  <a class="hl" id="hl" href="#" tabindex="-1" aria-hidden="true"></a>
  <a class="lg" href="#" aria-label="Artemis Galerie"><img src="logo.png" alt="" aria-hidden="true"></a>
  <button class="bg" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <h1 class="sr">Artemis Galerie</h1>
  <div class="mq" aria-hidden="true"><div class="trk" id="trk"></div></div>
</header>
<nav class="menu" id="menu" aria-label="Menu">
  <button class="cl" id="cl" data-i="close"></button>
  <ul><li><a href="#collection" data-i="nCol"></a></li><li><a href="#visite" data-i="nVis"></a></li></ul>
  <div class="ft"><div class="lang" role="group" aria-label="Langue"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
  <nav class="social" aria-label="Réseaux sociaux">
    <a href="https://www.instagram.com/artemisgalerietg/" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.facebook.com/p/Artemis-Galerie-61569428815346/" target="_blank" rel="noopener">Facebook</a>
    <a href="https://www.tiktok.com/@artemis.galerie" target="_blank" rel="noopener">TikTok</a>
  </nav></div>
</nav>
<main>
  <section class="sec" id="collection">
    <div class="hd"><h2 data-i="nCol"></h2><div class="flt" id="flt" role="group"></div></div>
    <div class="wall" id="wall"></div>
  </section>
  <section class="sec visit" id="visite">
    <div class="visit-intro"><h2 data-i="nVis"></h2><address data-i="addr"></address></div>
    <div class="visit-content">
      <section class="visit-block hours-block">
        <h3 data-i="hoursLabel"></h3>
        <dl id="hrs"></dl>
        <a class="btn k visit-wa" id="wa" data-i="wa" target="_blank" rel="noopener"></a>
      </section>
      <section class="visit-block map-block">
        <h3 data-i="mapLabel"></h3>
        <div class="visit-map"><iframe src="https://maps.google.com/maps?q=6.1628644,1.2293956&amp;z=16&amp;output=embed" title="Carte Google Maps de la Galerie Artémis" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
        <a class="map-link" href="https://maps.app.goo.gl/XiqSTBWZrN7b4yDK7" target="_blank" rel="noopener" data-i="map"></a>
      </section>
      <div class="contact-block">
        <h3 data-i="contactLabel"></h3>
        <div class="cn">
          <a href="tel:+22870211111"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 3H4.8A1.8 1.8 0 0 0 3 4.8C3 13.75 10.25 21 19.2 21a1.8 1.8 0 0 0 1.8-1.8V17l-5-1.2-1.2 2.4a15 15 0 0 1-7.2-7.2L10 9.8 8.8 5H7z"/></svg><span>+228 70 21 11 11</span></a>
          <a href="mailto:galerieartemis@gmail.com"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><span>galerieartemis@gmail.com</span></a>
        </div>
      </div>
      <div class="social-block">
        <h3 data-i="socialLabel"></h3>
        <nav class="visit-social social" aria-label="Réseaux sociaux">
          <a href="https://www.instagram.com/artemisgalerietg/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://www.facebook.com/p/Artemis-Galerie-61569428815346/" target="_blank" rel="noopener">Facebook</a>
          <a href="https://www.tiktok.com/@artemis.galerie" target="_blank" rel="noopener">TikTok</a>
        </nav>
      </div>
    </div>
  </section>
</main>
<footer><span>© 2026 Artemis Galerie</span></footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const {$,$$,W}=A;
let F='all',cur=0;
const HS=[W[0],W[1],W[2]];
const TY=['peinture','dessin','serigraphie','varia'].filter(k=>W.some(w=>w.ty===k));

function card(w){const u=A.url(w),ti=A.ti(w);
  return `<figure style="width:${w.r<.9?72:w.r<1.1?86:100}%"><a class="im" href="${u}" style="--vt:w${w.id}" aria-label="${ti}">${A.art(w,w.id)}</a><figcaption><div class="ar">${w.a}</div><div class="tt"><a href="${u}"><em>${ti}</em></a></div><div class="mt">${A.meta(w)}</div><div class="row">${A.price(w)}</div></figcaption></figure>`}

function linkHero(){ $('#hl').href=A.url(HS[cur]) }

function render(){const x=A.x();A.apply();
  const seg=`<span>${x.head}</span><i></i><span>Artemis Galerie</span><i></i>`;
  $('#trk').innerHTML=`<div>${seg.repeat(2)}</div><div>${seg.repeat(2)}</div>`;
  $('#hart').innerHTML=HS.map((w,i)=>A.art(w,'h'+i,1).replace('class="art"','class="art'+(i===cur?' on':'')+'"')).join('');
  linkHero();
  $('#flt').innerHTML=['all',...TY].map(k=>`<button data-f="${k}" aria-pressed="${k===F}">${x.f[k]}</button>`).join('');
  $('#wall').innerHTML=W.filter(w=>F==='all'||w.ty===F).map(card).join('');
  $('#hrs').innerHTML=x.h.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
  $('#wa').href=A.wa(x.gen)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;
  F=b.dataset.f;const y=scrollY;render();scrollTo(0,y)});

A.onLang=render;A.init();render();

setInterval(()=>{if(document.hidden||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  cur=(cur+1)%HS.length;
  $$('#hart .art').forEach((s,i)=>s.classList.toggle('on',i===cur));linkHero()},7000);
</script>
</body>
</html>
